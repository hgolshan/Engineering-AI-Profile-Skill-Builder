<!doctype html>
<html lang="en" dir="ltr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found - Engineering AI Profile & Skill Builder</title>
    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />
    <link rel="stylesheet" href="assets/css/styles.css" />
    <style>
      .error-container {
        min-height: 80vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2rem 1.5rem;
      }
      .error-code {
        font-family: var(--font-mono);
        font-size: 5rem;
        font-weight: 800;
        color: var(--accent-border);
        line-height: 1;
        margin-bottom: 1rem;
      }
      .error-title {
        font-size: 1.75rem;
        font-weight: 700;
        color: var(--text-primary);
        margin-bottom: 1rem;
      }
      .error-desc {
        font-size: 1rem;
        color: var(--text-secondary);
        max-width: 520px;
        line-height: 1.6;
        margin-bottom: 2rem;
      }
    </style>
  </head>
  <body>
    <div class="error-container">
      <div class="error-code">404</div>
      <h1 class="error-title">Page Not Found</h1>
      <p class="error-desc">
        The requested engineering resource or page does not exist in the repository. Please return to the Profile Builder home page.
      </p>
      <a href="./" class="control-btn primary">
        Return to Profile Builder
      </a>
    </div>
  </body>
</html>
